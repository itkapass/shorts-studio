name: Keepalive

# WHY THIS EXISTS
# GitHub disables scheduled (cron) workflows after 60 days with no commits to
# the repository. Nothing warns you. Your daily video generation would simply
# stop running one day and you would find out weeks later.
#
# This runs every 10 days and commits the concept ledger, which keeps the repo
# active on its own. It is a real commit of real data, not a fake empty one:
# the ledger is genuinely updated by the pipeline and genuinely worth having in
# version history.
#
# The alert is a BACKUP, not the mechanism. A reminder telling you to go push
# something manually is just another thing that can be missed on a busy week.

on:
  schedule:
    # Every 10 days at 04:17 UTC. The odd minute is deliberate — GitHub's
    # scheduler is heavily contended on the hour and jobs get delayed or
    # dropped at :00.
    - cron: "17 4 */10 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check how long since the last commit
        id: age
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "Last commit was $DAYS day(s) ago (GitHub disables cron at 60)."

      - name: Touch the activity marker
        run: |
          mkdir -p .github
          cat > .github/LAST_ACTIVE.md << 'EOF'
          # Repository activity marker

          Updated automatically by `.github/workflows/keepalive.yml`.

          GitHub disables scheduled workflows after 60 days of repository
          inactivity. This file is committed every 10 days so that never
          happens and your daily video generation keeps running.

          Do not delete this workflow.

          EOF
          echo "Last automated activity: $(date -u '+%Y-%m-%d %H:%M UTC')" >> .github/LAST_ACTIVE.md

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/LAST_ACTIVE.md concepts.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing changed; making an empty commit to register activity."
            git commit --allow-empty -m "chore: keepalive [skip ci]"
          else
            git commit -m "chore: keepalive + concept ledger [skip ci]"
          fi
          git push

      - name: Warn if this nearly did not run in time
        if: steps.age.outputs.days > 40
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="Keepalive ran, but the repo had been inactive for ${{ steps.age.outputs.days }} days (GitHub disables cron at 60). The keepalive itself may have been skipped previously — check the Actions tab." > /dev/null
          fi
