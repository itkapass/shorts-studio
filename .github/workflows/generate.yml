name: Generate Video Drafts

# ─────────────────────────────────────────────────────────────────
# WORKFLOW 2 of 6: Generate Video Drafts
#
# Writes ONE video and renders it, then stops. Runs 6 times a day.
# The finished draft waits in your Video Queue until you approve it.
# Nothing here ever touches YouTube.
# ─────────────────────────────────────────────────────────────────

on:
  # SIX RUNS A DAY, ONE VIDEO EACH — and all six inside a single Gemini
  # quota day.
  #
  # Gemini's free daily allowance resets at MIDNIGHT PACIFIC, which is
  # 07:00 UTC. The old schedule ran every 2 hours around the clock, so the
  # runs at 00:00, 02:00, 04:00 and 06:00 UTC were still inside Google's
  # PREVIOUS day and were spending an allowance that was already gone.
  # They got 429s, which pinned the internal counter to "full" for the
  # rest of the day — so the later runs, which had a completely fresh
  # quota available, refused to run. Zero videos, every day.
  #
  # These six times all sit between 01:00 and 16:00 Pacific, safely inside
  # one quota day, starting an hour after it refills.
  #
  #   08:00 UTC = 01:30 PM IST      17:00 UTC = 10:30 PM IST
  #   11:00 UTC = 04:30 PM IST      20:00 UTC = 01:30 AM IST
  #   14:00 UTC = 07:30 PM IST      23:00 UTC = 04:30 AM IST
  #
  # (Generation time does not affect your audience — only PUBLISH time
  # does, and that is a separate workflow with its own schedule.)
  #
  # Budget maths, against a free key's ~20 requests/day:
  #   6 videos x 2 requests (creative brief + storyboard) = 12
  #   3 personas x 1 request for topic top-up             =  3
  #   -------------------------------------------------------
  #                                                  total  15  of 20
  schedule:
    - cron: '0 8,11,14,17,20,23 * * *'

  # Manual trigger from the Actions tab. Leave "how many" blank for the
  # normal automatic behaviour (top up toward today's target). Fill it in
  # to generate a specific number right now regardless of the daily target
  # — e.g. to backfill after a quiet day, or to test a change immediately.
  # ── MANUAL "make me a video right now" ─────────────────────────────
  # Actions tab -> Generate Video Drafts -> Run workflow. Or press the
  # "Generate Video Now" button on the dashboard, which triggers this
  # same thing.
  workflow_dispatch:
    inputs:
      manual_count:
        description: "How many videos to generate right now (blank = automatic)"
        required: false
        default: ""
      skip_topics:
        description: "Skip inventing new topics (saves Gemini requests)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate Video Drafts
    runs-on: ubuntu-latest
    timeout-minutes: 90   # Safety limit: prevent runaway builds

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install system dependencies (FFmpeg) ───────────────────
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      # ── 4. Install Python dependencies ────────────────────────────
      - name: Install Python packages
        run: pip install -r requirements.txt

      # ── 5. Download Whisper model (cache between runs) ────────────
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-tiny-model-v1

      # ── 6. Run the generation pipeline ────────────────────────────
      # NOTE: storage upload now happens INSIDE this step (engine/storage.py
      # is called directly from orchestrator.py) — it used to be a separate,
      # unguarded step below with no error handling, which also meant it
      # only ever ran in this workflow and never for local/Docker runs. See
      # engine/storage.py's docstring for the full story.
      - name: Run video generation pipeline
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          # Optional free backup when Gemini's daily quota is gone — see docs/13.
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL:         ${{ secrets.GEMINI_MODEL }}   # optional — leave the secret unset to use the code default
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Cloudflare R2 (10 GB free, no egress fees). Leave these unset and
          # the pipeline automatically falls back to Supabase Storage (1 GB).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          # Alerting. Optional, but without it every failure is silent.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SUPABASE_ANON_KEY:    ${{ secrets.SUPABASE_ANON_KEY }}
          OUTPUT_DIR:           /tmp/shorts_output
          ASSETS_DIR:           assets
        run: |
          ARGS=""
          if [ "${{ inputs.skip_topics }}" = "true" ]; then
            ARGS="$ARGS --skip-topics"
          fi
          if [ -n "${{ inputs.manual_count }}" ]; then
            python -m engine.orchestrator --count "${{ inputs.manual_count }}" $ARGS
          else
            python -m engine.orchestrator $ARGS
          fi

      # ── 7. Safety net: retry-upload anything that didn't already upload ──
      # orchestrator.py uploads each video right after rendering it (with
      # retries — see engine/storage.py). This step just catches the rare
      # case where a video rendered fine but the upload itself failed even
      # after those retries, so a batch doesn't silently lose a video that
      # only needed one more attempt.
      - name: Retry any videos that failed to upload
        if: always()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Cloudflare R2 (10 GB free, no egress fees). Leave these unset and
          # the pipeline automatically falls back to Supabase Storage (1 GB).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          # Alerting. Optional, but without it every failure is silent.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          OUTPUT_DIR:           /tmp/shorts_output
        run: |
          python -m engine.storage --all-pending

      # Commit the concept ledger back to the repo. Two purposes: it is the
      # human-readable record of every idea already used, and the commit
      # doubles as repository activity so GitHub never disables the cron.
      - name: Commit concept ledger
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add concepts.jsonl 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update concept ledger [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          else
            echo "No new concepts to record."
          fi

      # Fires even if Python crashed on its very first line. The in-Python
      # alerting in engine/alerts.py cannot report a crash that happens before
      # engine/alerts.py is ever reached — this can.
      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow_name: "Generate Video Drafts"
          telegram_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat: ${{ secrets.TELEGRAM_CHAT_ID }}
